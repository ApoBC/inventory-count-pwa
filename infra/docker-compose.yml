version: '3.8'

services:
  # Base de datos principal
  postgres:
    image: postgres:16-alpine
    container_name: inventory-count-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-counting}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME:-counting_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-counting}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis para caché y colas
  redis:
    image: redis:7-alpine
    container_name: inventory-count-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway (Nginx)
  nginx:
    image: nginx:alpine
    container_name: inventory-count-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api-gateway
    networks:
      - app-network

  # API Gateway (Node.js)
  api-gateway:
    build:
      context: ../apps/api-gateway
      dockerfile: Dockerfile
    container_name: inventory-count-api-gateway
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: debug
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - inventory-service
      - counting-service
      - erp-mock
    networks:
      - app-network
    restart: unless-stopped

  # Auth Service
  auth-service:
    build:
      context: ../apps/auth-service
      dockerfile: Dockerfile
    container_name: inventory-count-auth-service
    environment:
      NODE_ENV: development
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-prod}
      JWT_EXPIRES_IN: 24h
      LOG_LEVEL: debug
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    networks:
      - app-network
    restart: unless-stopped

  # Inventory Service
  inventory-service:
    build:
      context: ../apps/inventory-service
      dockerfile: Dockerfile
    container_name: inventory-count-inventory-service
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: postgresql://${DB_USER:-counting}:${DB_PASSWORD:-secret}@postgres:5432/${DB_NAME:-counting_dev}
      REDIS_URL: redis://redis:6379
      ERP_GATEWAY_URL: http://erp-gateway:3004
      LOG_LEVEL: debug
    ports:
      - "3002:3002"
    depends_on:
      - postgres
      - redis
      - erp-gateway
    networks:
      - app-network
    restart: unless-stopped

  # Counting Service
  counting-service:
    build:
      context: ../apps/counting-service
      dockerfile: Dockerfile
    container_name: inventory-count-counting-service
    environment:
      NODE_ENV: development
      PORT: 3003
      DATABASE_URL: postgresql://${DB_USER:-counting}:${DB_PASSWORD:-secret}@postgres:5432/${DB_NAME:-counting_dev}
      REDIS_URL: redis://redis:6379
      INVENTORY_SERVICE_URL: http://inventory-service:3002
      ERP_GATEWAY_URL: http://erp-gateway:3004
      LOG_LEVEL: debug
    ports:
      - "3003:3003"
    depends_on:
      - postgres
      - redis
      - inventory-service
    networks:
      - app-network
    restart: unless-stopped

  # ERP Gateway
  erp-gateway:
    build:
      context: ../apps/erp-gateway
      dockerfile: Dockerfile
    container_name: inventory-count-erp-gateway
    environment:
      NODE_ENV: development
      PORT: 3004
      ERP_PROVIDER: ${ERP_PROVIDER:-mock}
      LOG_LEVEL: debug
    ports:
      - "3004:3004"
    depends_on:
      - erp-mock
    networks:
      - app-network
    restart: unless-stopped

  # ERP Mock (OData)
  erp-mock:
    build:
      context: ../apps/erp-mock
      dockerfile: Dockerfile
    container_name: inventory-count-erp-mock
    environment:
      NODE_ENV: development
      PORT: 3005
      LOG_LEVEL: debug
    ports:
      - "3005:3005"
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
